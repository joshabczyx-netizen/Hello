# mkinitcpio drop-in for the RAM-booted, LUKS-encrypted Arch system.
#
# No 'autodetect' on purpose: a portable (universal) image is built so the
# squashfs can boot on hardware other than the machine it was built on. If you
# always boot on the build host and want a smaller image, add 'autodetect'
# right after 'base udev'.
#
# 'ramboot' must stay last - it installs the mount_handler that assembles the
# in-RAM overlay root.

MODULES=()
BINARIES=()
FILES=()
HOOKS=(base udev modconf kms keyboard keymap block ramboot)
COMPRESSION="zstd"
